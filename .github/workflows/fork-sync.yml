# FORK: follows the original (Mastershort/neonplan3d). Every few hours: merge its newest release, build,
# test and publish it as vX.Y.Z.1 with the ZIP for HACS. On a conflict or a failing build an issue opens
# and nothing is released (see FORK.md, "Automatisch dem Original folgen").
name: Fork sync

on:
  schedule:
    - cron: "23 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: fork-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository != 'Mastershort/neonplan3d'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Merge, build and release the newest original
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python tools/fork_sync.py
